<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Player Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1>Player Dashboard</h1>

  <section id="create-player">
    <h2>Create Player</h2>
    <input id="full_name" placeholder="Full Name" />
    <input id="birthdate" type="date" />
    <input id="position" placeholder="Position" />
    <button onclick="createPlayer()">Create</button>
  </section>

  <hr />

  <section id="players-list">
    <h2>Players</h2>
    <div id="players"></div>
  </section>

  <hr />

  <section id="player-profile">
    <h2>Player Profile</h2>
    <div id="profile"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
